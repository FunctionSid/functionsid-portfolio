name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          SKIP_ORACLE_CRUD_TEST: 'true'
        run: npm test

  prepare-vm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          missing=0
          for name in VM_HOST VM_PORT VM_USER VM_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare Oracle Linux VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          port: ${{ secrets.VM_PORT }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1; then
              sudo dnf install -y git curl
            fi
            if [ ! -d /opt/functionsid/.git ]; then
              sudo mkdir -p /opt/functionsid
              sudo chown -R "$USER":"$USER" /opt/functionsid
              git clone https://github.com/FunctionSid/functionsid-portfolio.git /opt/functionsid
            fi
            cd /opt/functionsid
            git fetch origin main
            git reset --hard origin/main
            chmod +x deploy/*.sh
            ./deploy/install-vm.sh
            ./deploy/update.sh
            ./deploy/check.sh
            ./deploy/reload-app.sh
